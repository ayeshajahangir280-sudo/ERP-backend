name: PostgreSQL load smoke
on:
  workflow_dispatch:
  pull_request:
jobs:
  load-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: bakeryflow_load, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bakeryflow_load" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_load
      DJANGO_SECRET_KEY: ci-only-load-secret
      DJANGO_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py load_smoke --users 4 --iterations 10 --output load-smoke.json
      - uses: actions/upload-artifact@v4
        with: { name: load-smoke-results, path: load-smoke.json, retention-days: 14 }
