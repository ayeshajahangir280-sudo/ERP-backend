name: PostgreSQL load smoke
on:
  push:
    branches: [main]
    paths: ["apps/**", "common/**", "config/**", ".github/workflows/load-smoke.yml"]
  workflow_dispatch:
  pull_request:
jobs:
  load-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: bakeryflow_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bakeryflow_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test_postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test
      DJANGO_SECRET_KEY: ci-only-load-secret
      DJANGO_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_performance_data --products 20 --materials 20 --customers 50 --suppliers 20 --locations 4 --sales 250 --purchases 100 --ledger-entries 1000
      - run: python manage.py load_smoke --users 4 --iterations 10 --output load-smoke.json
      - uses: actions/upload-artifact@v4
        with: { name: load-smoke-results, path: load-smoke.json, retention-days: 14 }
