name: PostgreSQL query plans
on:
  push:
    branches: [main]
    paths: ["apps/**", "common/**", "config/**", "requirements.txt", ".github/workflows/query-plans.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  plans:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: bakeryflow_plans, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bakeryflow_plans" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_plans
      DJANGO_SECRET_KEY: ci-only-query-plan-secret
      DJANGO_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_performance_data --products 100 --materials 100 --customers 500 --suppliers 100 --locations 10 --sales 5000 --purchases 2000 --ledger-entries 20000
      - run: python manage.py capture_query_plans --output query-plans.txt
      - uses: actions/upload-artifact@v4
        with: { name: sanitized-postgresql-query-plans, path: query-plans.txt, retention-days: 14 }
