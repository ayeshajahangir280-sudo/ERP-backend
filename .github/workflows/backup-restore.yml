name: PostgreSQL backup restore verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: bakeryflow_backup, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bakeryflow_backup" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_backup
      DJANGO_SECRET_KEY: ci-only-backup-secret
      DJANGO_ALLOWED_HOSTS: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput && python manage.py seed_demo_data
      - run: python manage.py database_fingerprint --output before.json
      - run: pg_dump -Fc -h 127.0.0.1 -U postgres -d bakeryflow_backup -f backup.dump
      - run: createdb -h 127.0.0.1 -U postgres bakeryflow_restored && pg_restore -h 127.0.0.1 -U postgres -d bakeryflow_restored --no-owner backup.dump
      - run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored python manage.py check
      - run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored python manage.py migrate --check
      - run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored python manage.py database_fingerprint --output after.json
      - run: diff -u before.json after.json
