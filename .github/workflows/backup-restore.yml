name: PostgreSQL backup restore verification
on:
  push:
    branches: [main]
    paths: ["apps/**/migrations/**", "apps/**/models.py", "config/**", ".github/workflows/backup-restore.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: bakeryflow_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bakeryflow_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test_postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test
      DJANGO_SECRET_KEY: ci-only-backup-secret
      DJANGO_ALLOWED_HOSTS: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput && python manage.py seed_performance_data --products 10 --materials 10 --customers 20 --suppliers 10 --locations 3 --sales 100 --purchases 50 --ledger-entries 500
      - run: python manage.py database_fingerprint --output before.json
      - run: python manage.py verify_reconciliation
      - run: docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:17-alpine pg_dump -Fc -h 127.0.0.1 -U postgres -d bakeryflow_test -f /work/backup.dump
      - run: docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:17-alpine sh -c "createdb -h 127.0.0.1 -U postgres bakeryflow_restored_test && pg_restore -h 127.0.0.1 -U postgres -d bakeryflow_restored_test --no-owner /work/backup.dump"
      - run: TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test python manage.py check
      - run: TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test python manage.py migrate --check
      - run: TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test python manage.py database_fingerprint --output after.json
      - run: TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_restored_test python manage.py verify_reconciliation
      - run: diff -u before.json after.json
