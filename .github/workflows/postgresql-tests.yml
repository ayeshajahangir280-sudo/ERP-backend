name: PostgreSQL verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bakeryflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bakeryflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test
      DJANGO_SETTINGS_MODULE: config.settings_test_postgres
      DJANGO_SECRET_KEY: ci-test-only-not-a-production-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time, psycopg
          for attempt in range(30):
              try:
                  psycopg.connect("postgresql://postgres:postgres@127.0.0.1:5432/bakeryflow_test").close()
                  break
              except psycopg.OperationalError:
                  if attempt == 29: raise
                  time.sleep(1)
          PY
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --exclude-tag=postgres
      - name: PostgreSQL concurrency suite
        run: python manage.py test tests.postgres
